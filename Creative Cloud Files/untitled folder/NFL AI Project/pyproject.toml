[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nfl-chatbot"
version = "0.1.0"
description = "AI-powered NFL chatbot with game prediction, player analysis, and betting trends"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Saketh Boddu" }]

dependencies = [
    # Data
    "nflreadpy>=0.1.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",
    # ML
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    # Visualization
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    # LLM
    "anthropic>=0.25.0",
    "openai>=1.14.0",
    # Scraping
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "requests>=2.31.0",
    # Config
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    # Frontend
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
nfl-chatbot = "nfl_chatbot.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_chatbot"]

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "pyproject.toml"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/nfl_chatbot --cov-report=term-missing"
